<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Academy Tracker — 3U / Character</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212a; --line:#262b36; --fg:#e6e9ef; --dim:#96a0b2;
    --acc:#5aa9ff;
    --s-none:#3a4050; --s-draft:#8957e5; --s-uploaded:#3b82f6;
    --s-panel:#d29922; --s-approved:#3fb950; --s-issue:#f85149;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --card:#fff; --card2:#f0f2f5; --line:#e1e5ea; --fg:#1b1f27; --dim:#5d6673;
           --acc:#0969da; --s-none:#c4cad4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,"Segoe UI","Noto Sans SC",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
  header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:12.5px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
       padding:9px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:6px 6px 0 0}
  .tab:hover{color:var(--fg);background:var(--card2)}
  .tab.on{color:var(--acc);border-bottom-color:var(--acc)}
  .tab .n{font-weight:400;font-size:12px;opacity:.75;margin-left:5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin:14px 0}
  h2{font-size:15px;margin:26px 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px 22px}
  .kv div{font-size:13.5px} .kv b{display:block;color:var(--dim);font-weight:600;font-size:11.5px;
       text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .bars{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 2px}
  .bar{flex:1;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .bar b{display:block;font-size:20px;line-height:1.3} .bar span{font-size:11.5px;color:var(--dim)}
  .track{height:6px;border-radius:99px;background:var(--s-none);overflow:hidden;margin-top:8px;display:flex}
  .track i{display:block;height:100%}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:8px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  thead th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
           position:sticky;top:0;background:var(--bg);z-index:2;white-space:nowrap}
  .grp{text-align:center;border-left:1px solid var(--line)}
  td.grpstart{border-left:1px solid var(--line)}
  .course b{display:block;font-size:13.5px}
  .course span{color:var(--dim);font-size:11.5px}
  .lvl{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:5px;
       padding:0 6px;font-size:11px;color:var(--dim);margin-left:6px}
  .cell{width:100%;min-width:64px;border:1px solid transparent;border-radius:6px;padding:5px 4px;
        font:inherit;font-size:11px;font-weight:700;color:#fff;cursor:pointer;text-align:center;
        letter-spacing:.02em}
  .cell:hover{filter:brightness(1.16);border-color:var(--fg)}
  .cell.s-none{background:var(--s-none);color:var(--dim)}
  .cell.s-draft{background:var(--s-draft)} .cell.s-uploaded{background:var(--s-uploaded)}
  .cell.s-panel{background:var(--s-panel);color:#241a00} .cell.s-approved{background:var(--s-approved);color:#04250d}
  .cell.s-issue{background:var(--s-issue)}
  .cell small{display:block;font-weight:500;font-size:9.5px;opacity:.85}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin:10px 0 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .note{font-size:12px;color:var(--dim);padding:2px 0 8px}
  .blk{border-left:3px solid var(--line);padding:9px 0 9px 13px;margin:11px 0}
  .blk.high{border-left-color:var(--s-issue)} .blk.med{border-left-color:var(--s-panel)}
  .blk.low{border-left-color:var(--acc)}
  .blk q{display:block;font-weight:600;font-size:14px;margin-bottom:3px}
  .blk q:before,.blk q:after{content:""}
  .blk .why{font-size:12.5px;color:var(--dim)}
  .who{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:5px;
       padding:0 6px;font-size:11px;color:var(--dim);margin-right:6px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.btn{appearance:none;background:var(--card);border:1px solid var(--line);color:var(--fg);
       border-radius:7px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  button.btn:hover{border-color:var(--acc);color:var(--acc)}
  a.btn{text-decoration:none}
  #save{font-size:12px;color:var(--dim);min-height:17px}
  #save.ok{color:var(--s-approved)} #save.err{color:var(--s-issue)}
  a{color:var(--acc)}
  .dl{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
  @media print{ .tabs,.actions,.legend{display:none} body{background:#fff} .panel{display:block!important} }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>Academy Tracker</h1>
    <div class="meta" id="hmeta">载入中…</div>
  </div>
  <div class="actions">
    <span id="save"></span>
    <a class="btn" href="/api/export">⬇ 下载 JSON</a>
    <button class="btn" id="snap">⬇ 下载快照 HTML</button>
    <button class="btn" onclick="print()">🖨 打印</button>
    <a class="btn" href="/">📄 结论 · 推理 · 源数据</a>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

</div>
<script>
const ORDER = ["none","draft","uploaded","panel","approved","issue"];
const LABEL = {none:"未开始",draft:"草稿",uploaded:"已上传",panel:"送审中",approved:"已批准",issue:"有问题"};
const WEIGHT = {none:0,draft:.35,uploaded:.75,panel:.9,approved:1,issue:.4};
let S=null, cur=0, timer=null;

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keys = p => { const o=[]; for(const g of p.matrix.groups) for(const c of p.matrix.cols) o.push(g+"|"+c); return o; };

function stats(p){
  const ks=keys(p); let tot=0, done=0, per={};
  ORDER.forEach(s=>per[s]=0);
  for(const c of p.courses) for(const k of ks){
    const st=(c.cells[k]||{}).status||"none";
    per[st]++; tot++; done+=WEIGHT[st];
  }
  return {tot, pct: tot? Math.round(done/tot*100):0, per};
}

function daysLeft(d){
  if(!d) return null;
  const t=new Date(d+"T23:59:59+08:00")-new Date();
  return Math.ceil(t/86400000);
}

function render(){
  document.getElementById("hmeta").textContent =
    "最后更新 "+(S.updatedAt||"—")+" · 共 "+S.projects.length+" 个项目";
  document.getElementById("tabs").innerHTML = S.projects.map((p,i)=>{
    const st=stats(p);
    return `<button class="tab ${i===cur?'on':''}" data-i="${i}">${esc(p.tab)}<span class="n">${st.pct}%</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    cur=+b.dataset.i;
    history.replaceState(null,"","#"+S.projects[cur].id);
    render();
  });

  const p=S.projects[cur], st=stats(p), ks=keys(p), dl=daysLeft(p.deadline);

  let head1=`<tr><th rowspan="2">${esc(p.matrix.rowLabel)}</th>`;
  for(const g of p.matrix.groups)
    head1+=`<th class="grp" colspan="${p.matrix.cols.length}">${esc(g||"进度")}</th>`;
  head1+=`</tr><tr>`;
  for(const g of p.matrix.groups)
    p.matrix.cols.forEach((c,ci)=> head1+=`<th class="${ci===0?'grp':''}">${esc(c)}</th>`);
  head1+=`</tr>`;

  const rows=p.courses.map((c,ci)=>{
    let r=`<tr><td class="course"><b>${esc(c.name)}</b>
      <span>${esc(c.code)}</span><span class="lvl">${esc(c.level)}</span>
      ${c.note?`<div class="note">${esc(c.note)}</div>`:""}</td>`;
    ks.forEach((k,ki)=>{
      const cell=c.cells[k]||{status:"none"}, s=cell.status||"none";
      const first = ki % p.matrix.cols.length === 0;
      const sub = cell.pages!=null ? `${cell.pages}p` : (cell.owner||"");
      r+=`<td class="${first?'grpstart':''}"><button class="cell s-${s}" data-c="${ci}" data-k="${esc(k)}"
           title="${esc(k.replace('|',' · '))} — ${LABEL[s]}${cell.owner?' ('+cell.owner+')':''}${
             (cell.issues&&cell.issues.length)?'\\n⚠ '+cell.issues.join('; '):''}">
           ${LABEL[s]}${sub?`<small>${esc(sub)}</small>`:""}</button></td>`;
    });
    return r+`</tr>`;
  }).join("");

  const segs = ORDER.filter(s=>st.per[s]).map(s=>
    `<i style="width:${st.per[s]/st.tot*100}%;background:var(--s-${s})"></i>`).join("");

  document.getElementById("main").innerHTML = `
  <div class="card">
    <div class="kv">
      <div><b>客户</b>${esc(p.client)}</div>
      <div><b>联系人</b>${esc(p.contact)}</div>
      <div><b>考试时长</b>${esc(p.examDuration||"—")}</div>
      <div><b>截止</b>${p.deadline?esc(p.deadline)+(dl!==null?` <span style="color:var(--${dl<=3?'s-issue':'dim'})">（剩 ${dl} 天）</span>`:""):"—"}</div>
    </div>
    <div class="note" style="margin-top:10px">${esc(p.goal)}</div>
    ${p.deadlineNote?`<div class="note" style="color:var(--s-panel)">⏱ ${esc(p.deadlineNote)}</div>`:""}
    ${p.completeRule?`<div class="note">✅ 「完成」的定义：${esc(p.completeRule)}</div>`:""}
  </div>

  <div class="bars">
    <div class="bar"><b>${st.pct}%</b><span>加权完成度</span><div class="track">${segs}</div></div>
    <div class="bar"><b>${st.per.approved}</b><span>已批准 / 共 ${st.tot} 项</span></div>
    <div class="bar"><b>${st.per.uploaded}</b><span>已上传待审</span></div>
    <div class="bar"><b>${st.per.none}</b><span>未开始</span></div>
  </div>

  <h2>交付矩阵</h2>
  <div class="note">点击任一格循环状态：未开始 → 草稿 → 已上传 → 送审中 → 已批准 → 有问题</div>
  <div style="overflow-x:auto"><table><thead>${head1}</thead><tbody>${rows}</tbody></table></div>
  <div class="legend">${ORDER.map(s=>`<span><i style="background:var(--s-${s})"></i>${LABEL[s]}</span>`).join("")}</div>

  <h2>待澄清 / 卡点（${p.blockers.length}）</h2>
  ${p.blockers.map(b=>`<div class="blk ${esc(b.sev)}">
      <q>${esc(b.q)}</q>
      <div class="why"><span class="who">${esc(b.who)}</span>${esc(b.why)}
      <span style="opacity:.7"> · 自 ${esc(b.since)}</span></div></div>`).join("") || '<div class="note">无</div>'}

  ${p.refs&&p.refs.length?`<h2>参考</h2><div class="card"><div class="dl">${p.refs.map(r=>
     r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>`
          :`<a href="https://drive.google.com/drive/folders/${esc(r.id)}" target="_blank" rel="noopener">${esc(r.label)}</a>`
   ).join("")}</div></div>`:""}
  `;

  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{
    const c=S.projects[cur].courses[+b.dataset.c];
    const k=b.dataset.k;
    if(!c.cells[k]) c.cells[k]={status:"none"};
    const i=ORDER.indexOf(c.cells[k].status||"none");
    c.cells[k].status=ORDER[(i+1)%ORDER.length];
    render(); save();
  });
}

function flag(msg,cls){ const e=document.getElementById("save"); e.textContent=msg; e.className=cls||""; }

function save(){
  clearTimeout(timer);
  flag("● 未保存");
  timer=setTimeout(async()=>{
    try{
      flag("保存中…");
      const r=await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify(S)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json(); S.updatedAt=j.updatedAt;
      flag("✓ 已保存 "+j.updatedAt.slice(11,19),"ok");
      document.getElementById("hmeta").textContent =
        "最后更新 "+S.updatedAt+" · 共 "+S.projects.length+" 个项目";
    }catch(e){ flag("✗ 保存失败："+e.message+"（改动仍在本页，勿关闭）","err"); }
  },600);
}

document.getElementById("snap").onclick=()=>{
  const html="<!DOCTYPE html>"+document.documentElement.outerHTML
    .replace(/<script[\s\S]*?<\/script>/g,"")
    .replace(/<nav class="tabs"[\s\S]*?<\/nav>/,"");
  const b=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=`academy-${S.projects[cur].id}-${new Date().toISOString().slice(0,10)}.html`;
  a.click();
};

(async()=>{
  try{
    const r=await fetch("/api/state"); if(!r.ok) throw new Error("HTTP "+r.status);
    S=await r.json();
    const h=location.hash.slice(1);
    if(h){ const i=S.projects.findIndex(p=>p.id===h); if(i>=0) cur=i; }
    render(); flag("");
  }catch(e){
    document.getElementById("main").innerHTML =
      `<div class="card">载入失败：${esc(e.message)}。后端可能未运行 —— 检查 <code>academy-tracker.service</code>。</div>`;
  }
})();
</script>
</body>
</html>
